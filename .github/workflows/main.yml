name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    # Start five minutes early to avoid GitHub Actions' high-load hour boundary.
    # The job waits below and never sends before 08:00 Asia/Shanghai.
    - cron: '55 23 * * *'

permissions:
  contents: write

concurrency:
  group: daily-arxiv-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Wait until 08:00 Beijing time
        run: |
          target=$(TZ=Asia/Shanghai date -d 'today 08:00' +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            sleep "$((target - now))"
          fi

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py \
            llm.content_mode=translate_abstract \
            llm.generation_kwargs.max_tokens=1536 \
            email.timezone=Asia/Shanghai \
            executor.deduplicate=true

      - name: Persist paper history
        if: success()
        run: |
          if git diff --quiet -- .github/paper-history.json; then
            echo "Paper history is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/paper-history.json
          git commit -m "chore: update sent-paper history [skip ci]"
          git push
